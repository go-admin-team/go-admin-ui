<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>go-admin</title>
  <meta name="keywords" content="go-admin,gin,权限管理系统,gin-admin,gin-vue-admin,go">
  <meta name="description"
    content="基于Gin + Vue + Element UI的前后端分离权限管理系统，初始化极度简单，只需要配置文件中，修改数据库连接，系统启动后会自动初始化数据库信息以及必须的基础数据">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
      background: #f0f1f5;
    }

    /* ============ 首屏加载 ============
       与侧边栏、登录页统一的深蓝品牌色；
       以字标 + 细进度条替代旋转圆环，减少视觉噪声。 */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1f3a;
      background-image:
        radial-gradient(ellipse at 50% 35%, rgba(22, 119, 255, 0.30) 0%, transparent 60%),
        linear-gradient(160deg, #0b1f3a 0%, #10294d 55%, #0b1f3a 100%);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    /* 品牌字标 */
    #loader-wrapper .brand {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #fff;
      opacity: 0;
      animation: brandIn 0.6s ease forwards;
    }

    #loader-wrapper .brand em {
      font-style: normal;
      color: #40a9ff;
    }

    /* 细进度条：不确定进度，使用往复滑块 */
    #loader-wrapper .bar {
      position: relative;
      width: 180px;
      height: 2px;
      margin-top: 22px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
      opacity: 0;
      animation: brandIn 0.6s ease 0.1s forwards;
    }

    #loader-wrapper .bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #1677ff 35%, #69c0ff 65%, transparent);
      animation: slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    #loader-wrapper .tip {
      margin-top: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      opacity: 0;
      animation: brandIn 0.6s ease 0.2s forwards;
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    /* 应用挂载后淡出移除 */
    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
    }

    /* 尊重系统的减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
      #loader-wrapper .brand,
      #loader-wrapper .bar,
      #loader-wrapper .tip { animation: none; opacity: 1; }
      #loader-wrapper .bar::after { animation: none; left: 0; width: 100%; }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <!-- 置于 #app 之外，避免 Vue 挂载时被直接替换掉，从而能播放淡出过渡 -->
  <div id="loader-wrapper">
    <div class="brand">go<em>-</em>admin</div>
    <div class="bar"></div>
    <div class="tip">正在加载系统资源</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
